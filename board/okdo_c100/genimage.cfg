# microSD card: a FAT boot partition, marked bootable so that the distro boot
# of the U-Boot on the eMMC finds boot.scr, and the ext4 root filesystem.

image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"boot.scr",
			"u-boot.bin",
			"Image",
			"tegra210-p3448-0002-okdo-c100.dtb"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		partition-type-uuid = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
		bootable = true
		offset = 4M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "a57829cf-995e-43fc-86e3-591c78f62b06"
		image = "rootfs.ext4"
	}
}
